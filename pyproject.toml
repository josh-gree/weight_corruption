[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-corruption"
version = "0.1.0"
description = "Systematic weight corruption analysis for Pythia (GPT-NeoX) models"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "scipy>=1.11",
    "accelerate>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weight_corruption*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
